name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PAPYRUS_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify contract/schema drift
        run: pnpm contracts:check
      - name: Generate and verify compliance evidence
        run: pnpm compliance:check
      - name: Install Linux command isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Upload SPDX SBOM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: papyrus-sbom-spdx
          path: compliance/sbom.spdx.json
          if-no-files-found: error
