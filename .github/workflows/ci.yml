name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-refresh:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/rich-context-workspace' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Emit regenerated lockfile
        run: |
          echo 'PAPYRUS_LOCKFILE_GZIP_BASE64_BEGIN'
          gzip -c pnpm-lock.yaml | base64 -w0
          echo
          echo 'PAPYRUS_LOCKFILE_GZIP_BASE64_END'

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      PAPYRUS_REQUIRE_SANDBOX_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux command isolation
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # GitHub's ephemeral Ubuntu runner restricts unprivileged namespaces
          # by default. They are required for the sandbox integration test.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
