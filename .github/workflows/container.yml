name: hardened-container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/papyrus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hydrate extension workspace
        uses: actions/checkout@v4
        with:
          repository: beaglabs/papyrus-extensions
          path: vendor/papyrus-extensions
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build hardened image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: papyrus:${{ github.sha }}
          # The docker exporter used by load:true cannot import the manifest list
          # produced by inline SBOM/provenance attestations. The workflow generates
          # a CycloneDX SBOM below and attests published images separately on push.
          provenance: false
          sbom: false
      - name: Verify hardened non-root runtime
        run: |
          test "$(docker run --rm --entrypoint node papyrus:${GITHUB_SHA} -p 'process.getuid()')" != "0"
          docker run --rm --entrypoint node papyrus:${GITHUB_SHA} -e 'require("node:crypto").createHash("sha256").update("papyrus").digest("hex")'
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: papyrus:${{ github.sha }}
          format: cyclonedx-json
          output-file: papyrus.cdx.json
      - name: Generate Trivy SARIF
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: papyrus:${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true
          scanners: vuln
      - name: Upload scan
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
      - name: Preserve Trivy SARIF
        if: ${{ always() && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: error
      - name: Enforce HIGH/CRITICAL vulnerability gate
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 1 \
            --format table \
            papyrus:${GITHUB_SHA}
      - name: Publish image
        id: digest
        if: github.event_name == 'push'
        run: |
          docker tag papyrus:${GITHUB_SHA} ${IMAGE}:${GITHUB_SHA}
          docker push ${IMAGE}:${GITHUB_SHA}
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' ${IMAGE}:${GITHUB_SHA} | tr -d '"')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "${IMAGE}@${digest}" > image-digest.txt
      - name: Install Cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - name: Sign image
        if: github.event_name == 'push'
        run: cosign sign --yes "$(cat image-digest.txt)"
      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
