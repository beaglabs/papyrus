# Papyrus declarative config. Secrets stay in environment variables
# (PAPYRUS_SESSION_SECRET, PAPYRUS_SECRET_*, TLS keys, etc.).
# Point PAPYRUS_CONFIG_FILE at this file (or copy it to papyrus.yaml).

# Additional agent commands, keyed by kind. `goose` is built in.
# Model configuration is handled by the agent itself via ACP protocol.
agents:
  opencode:
    command: opencode
    args: [acp]
    env:
      MODEL: "test-model"
      OPENAI_BASE_URL: "http://localhost:11434/v1"
      OPENAI_API_KEY: "test-key"

# Offline license trust roots: key ID → PEM public key.
licenseAuthorities:
  root: |
    -----BEGIN PUBLIC KEY-----
    REPLACE-WITH-AUTHORITY-PUBLIC-KEY
    -----END PUBLIC KEY-----
