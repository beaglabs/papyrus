# Papyrus declarative config. Secrets stay in environment variables
# (PAPYRUS_SESSION_SECRET, PAPYRUS_SECRET_*, TLS keys, etc.).
# Point PAPYRUS_CONFIG_FILE at this file (or copy it to papyrus.yaml).

# Additional agent runtimes, keyed by kind. `goose` is built in.
# `env` values may use {model}, {baseUrl}, {secret}, and {provider} placeholders.
agents:
  opencode:
    command: opencode
    args: [acp]
    env:
      MODEL: "{model}"
      OPENAI_BASE_URL: "{baseUrl}"
      OPENAI_API_KEY: "{secret}"

# Offline license trust roots: key ID → PEM public key.
licenseAuthorities:
  root: |
    -----BEGIN PUBLIC KEY-----
    REPLACE-WITH-AUTHORITY-PUBLIC-KEY
    -----END PUBLIC KEY-----
