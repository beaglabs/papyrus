# Papyrus declarative config. Secrets stay in environment variables
# (PAPYRUS_SESSION_SECRET, PAPYRUS_SECRET_*, TLS keys, etc.).
# Point PAPYRUS_CONFIG_FILE at this file (or copy it to papyrus.yaml).

# Runtime aliases select closed, built-in profiles. Commands and arguments are
# not configurable. Sensitive values may only reference PAPYRUS_SECRET_* names.
agents:
  reviewer:
    profile: opencode
    environment:
      OPENAI_API_KEY: PAPYRUS_SECRET_OPENAI

# Optional connector metadata. Launch remains supervised by Papyrus.
connectors: [chrome-acp]

# Offline license trust roots: key ID → PEM public key.
licenseAuthorities:
  root: |
    -----BEGIN PUBLIC KEY-----
    REPLACE-WITH-AUTHORITY-PUBLIC-KEY
    -----END PUBLIC KEY-----
